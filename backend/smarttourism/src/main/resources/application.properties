# ============================================================
# Smart Tourism Platform — Application Configuration
# ============================================================
# IMPORTANT: Replace the ${...} placeholders with actual values.
# NEVER commit real credentials to version control.
# Use environment variables or a .env tool (e.g. Spring dotenv).
# ============================================================

# ---- Application ----
spring.application.name=SmartTourism
server.port=${SERVER_PORT:8080}

# ---- Database ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_tourism}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:SmartTourismSecretKey2024ChangeThisInProduction!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Weather API (OpenWeatherMap) ----
app.weather.api-key=${WEATHER_API_KEY:}
app.weather.base-url=https://api.openweathermap.org/data/2.5

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,null}

# ---- Logging ----
logging.level.com.smarttourism=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ---- Sample Data Seeder ----
# Set to true only on first run; set to false after data is seeded
app.seeder.enabled=${SEEDER_ENABLED:true}
